# AI课堂API服务配置
server {
    listen 80;
    server_name api.ai-classroom.com localhost;
    
    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API路由
    location /api/ {
        # 限流
        limit_req zone=api burst=20 nodelay;
        
        # 代理设置
        proxy_pass http://ai_classroom_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # WebSocket路由
    location /ws {
        proxy_pass http://ai_classroom_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket特殊配置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 文件上传路由
    location /api/v1/courses/upload {
        # 上传限流
        limit_req zone=upload burst=5 nodelay;
        
        # 增加上传超时
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        proxy_pass http://ai_classroom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件服务
    location /storage/ {
        alias /usr/share/nginx/html/storage/;
        
        # 缓存设置
        expires 7d;
        add_header Cache-Control "public, no-transform";
        
        # 音频文件支持Range请求
        location ~* \.(mp3|wav|m4a)$ {
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=604800";
        }
        
        # 图片文件优化
        location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=2592000";
        }
        
        # 文档文件
        location ~* \.(pdf|doc|docx)$ {
            add_header Cache-Control "private, max-age=3600";
            add_header Content-Disposition "attachment";
        }
    }

    # 健康检查
    location /health {
        proxy_pass http://ai_classroom_backend/api/v1/health;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 404错误处理
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # 50x错误处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# HTTPS配置 (生产环境)
server {
    listen 443 ssl http2;
    server_name api.ai-classroom.com;
    
    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # 其他配置与HTTP相同
    include /etc/nginx/conf.d/ai-classroom-common.conf;
}

# HTTP重定向到HTTPS (生产环境)
server {
    listen 80;
    server_name api.ai-classroom.com;
    return 301 https://$server_name$request_uri;
}