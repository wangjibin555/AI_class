version: '3.8'

services:
  # AI课堂后端服务
  ai-classroom-api:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: ai-classroom-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_MODE=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=ai_classroom
      - DB_PASSWORD=ai_classroom_pass
      - DB_NAME=ai_classroom
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    volumes:
      - ../../storage:/app/storage
      - ../../backend/configs/config.yaml:/app/configs/config.yaml
    depends_on:
      - mysql
      - redis
    networks:
      - ai-classroom-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: ai-classroom-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=ai_classroom
      - MYSQL_USER=ai_classroom
      - MYSQL_PASSWORD=ai_classroom_pass
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - ai-classroom-network
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: ai-classroom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-classroom-network
    command: redis-server --appendonly yes

  # Nginx反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: ai-classroom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ../../storage:/usr/share/nginx/html/storage
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - ai-classroom-api
    networks:
      - ai-classroom-network

  # 数据库管理工具 (可选)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ai-classroom-phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=mysql123456
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - ai-classroom-network

  # Redis管理工具 (可选)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-classroom-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - ai-classroom-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-classroom-network:
    driver: bridge